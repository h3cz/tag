name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No package-lock.json is committed yet (generated offline); use npm install
      # until a lockfile lands, then switch this to `npm ci` + `cache: npm`.
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm run build
